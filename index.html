<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>entSPANNUNG&nbsp;– RSI protect®</title>
<!-- App-Icon „entSPANNUNG“ (Variante A „Weiß“, MZ 23.10.2026) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-title" content="entSPANNUNG">
<link rel="preload" as="image" href="bilder/icon-blitzschutz.webp">
<link rel="preload" as="font" type="font/woff2" href="schrift/titillium-web-700.woff2" crossorigin>
<style>
  /* Startseite „entSPANNUNG“ – Layout B1 „Farbblöcke“ (MZ, 23.10.2026; Vorlagen Material/Vorschau/startseite-layouts/
     layout-b1.html und layout-b1-quer.html): weißer Logo-Balken, darunter Sammlungsname und Gesamt-Bestwert, dann drei
     exakt gleich hohe Blöcke (Blitzschutz Gelb, Elektroprüfung Grau, Entspannung Hellgrau) mit großem Icon im weißen Ring,
     Bereichsname und je drei Spielzeilen (Bestwert, blauer ▶-Knopf). Blau und Lila nur als Akzent (Knöpfe). Unten Adresse,
     Impressum, Datenschutz. Schrift Titillium Web (falls auf dem Gerät vorhanden), sonst Segoe UI/Systemschrift. */
  /* Schrift der Website: Titillium Web, lokal (schrift/, Lizenz OFL schrift/OFL.txt, nur Latin) – nichts von fremden Servern */
  @font-face { font-family: 'Titillium Web'; font-style: normal; font-weight: 400; font-display: swap; src: url('schrift/titillium-web-400.woff2') format('woff2'); }
  @font-face { font-family: 'Titillium Web'; font-style: normal; font-weight: 600; font-display: swap; src: url('schrift/titillium-web-600.woff2') format('woff2'); }
  @font-face { font-family: 'Titillium Web'; font-style: normal; font-weight: 700; font-display: swap; src: url('schrift/titillium-web-700.woff2') format('woff2'); }
  @font-face { font-family: 'Titillium Web'; font-style: normal; font-weight: 900; font-display: swap; src: url('schrift/titillium-web-900.woff2') format('woff2'); }
  :root {
    --gelb: #FFD500; --grau: #575757; --dunkel: #191919; --hell: #f2f2f2; --blau: #0F9CD8; --lila: #951B81;
    --balken-h: 62px; --logo-h: 40px; --ton: 30px; --name: 36px; --best: 20px;
    --icon: 150px; --ring: 6px; --h2: 30px; --zeile-h: 32px; --zeile-abstand: 7px; --zeile-f: 14px; --wert-f: 11px; --play: 24px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; overscroll-behavior: none; }
  html { background: #fff; }
  html.unten { background: var(--grau); }   /* Rand unter dem Band beim Weiterwischen in der Farbe des Bands */
  body {
    min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: #fff; color: var(--dunkel);
    font-family: "Titillium Web", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  /* Logo-Balken: Logo steht für sich (MZ, 20.10.2026), Ton-Knopf rechts (Lila) */
  .logobalken {
    position: relative; z-index: 2; flex: none; display: flex; align-items: center; justify-content: center;
    height: calc(var(--balken-h) + env(safe-area-inset-top)); padding-top: env(safe-area-inset-top); background: #fff;
  }
  .logo { display: block; height: var(--logo-h); width: auto; }
  #tonKnopf {
    position: absolute; right: 14px; top: calc(env(safe-area-inset-top) + (var(--balken-h) - var(--ton)) / 2);
    width: var(--ton); height: var(--ton); padding: 0; border: 0; border-radius: 50%; cursor: pointer;
    background: var(--blau);   /* Ton-Knopf blau (MZ 24.10.2026) */ color: #fff; display: grid; place-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.2);
    transition: transform .15s, filter .15s;
  }
  #tonKnopf svg { width: 60%; height: 60%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #tonKnopf:hover { transform: scale(1.1); filter: brightness(1.1); }
  #tonKnopf:active { transform: scale(.92); }
  /* Sammlungsname „entSPANNUNG“ (Schreibweise MZ) als Wortmarke, siehe unten bei .name */
  /* Kopf: Wortmarke oben, freier Raum, Punktezeile fast direkt am ersten Block (ca. 10px, MZ 23.10.2026) */
  .kopf { flex: none; text-align: center; padding: 14px 16px 10px; }
  /* Wortmarke „Rund & kantig“ (MZ, 23.10.2026; Vorlage Material/Vorschau/titel-logo/titel-vorschlaege.html, Vorschlag 2):
     „ent“ weiß in weicher grauer Pille (links rund), „SPANNUNG“ dunkel auf kantigem gelbem Schrägbalken (Parallelogramm).
     Maße in em (Vorlage 40px), Größe je Format über --name; im schmalen Hochformat schrumpft sie mit der Breite. */
  .name {
    margin: 0; display: flex; justify-content: center; align-items: center; line-height: 1;
    font-size: min(var(--name), calc((100vw - 40px) / 9.2));
  }
  .name .e { background: var(--grau); color: #fff; font-weight: 600; padding: .2em .5em .25em .55em; border-radius: 999px 0 0 999px; position: relative; z-index: 1; }
  .name .s {
    position: relative; overflow: hidden; background: var(--gelb); color: var(--dunkel); font-weight: 900; letter-spacing: .025em;
    padding: .2em .65em .25em .55em; margin-left: -.15em; clip-path: polygon(0 0, 100% 0, calc(100% - .35em) 100%, 0 100%);   /* links gerade an die Pille (MZ 24.10.2026), rechts schräg */
  }
  /* Glanzstreifen für das Aufblitzen des Balkens (läuft per Skript durch) */
  .name .glanz {
    position: absolute; top: 0; bottom: 0; left: 0; width: 40%; pointer-events: none; opacity: 0; transform: translateX(-110%) skewX(-20deg);
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.85) 50%, rgba(255,255,255,0));
  }
  .best { margin: 30px 0 0; font-size: var(--best); line-height: 1.25; color: var(--grau); }
  /* Gesamtpunktzahlen: weiß auf kleinem lila Kästchen (Ton-Knopf-Farbe) – auf allen Blockfarben lesbar (MZ 24.10.2026) */
  .best b, .summe b {
    font-weight: 700; color: #fff; background: var(--lila); display: inline-block; padding: .05em .45em; border-radius: 999px;
    line-height: 1.25; min-width: 1.35em; box-sizing: border-box; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.18);
    /* runde Pille; Zahlen immer vierstellig („0.000“, MZ 24.10.2026) */
  }
  /* Gesamt je Bereich: rechtsbündig an der rechten Kante der Spielzeilen (MZ 24.10.2026), Größe wie die Bestwerte */
  .summe {
    width: 100%; max-width: 440px; margin: 6px 0 0; text-align: right; font-size: var(--wert-f); line-height: 1.2;
    padding-right: 0; font-variant-numeric: tabular-nums;
  }
  /* Drei Blöcke, exakt gleich hoch (grid-auto-rows: 1fr; kein optischer Ausgleich, MZ 23.10.2026) */
  .bloecke { display: grid; grid-template-columns: 1fr; grid-auto-rows: 1fr; }
  .block {
    position: relative; isolation: isolate; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 22px 18px 22px;
  }
  .block .flaeche { position: absolute; inset: 0; z-index: -1; background: var(--farbe); }
  .gelb { --farbe: var(--gelb); color: var(--dunkel); }
  .grau { --farbe: var(--grau); color: #fff; }
  .hell { --farbe: var(--hell); color: var(--dunkel); }
  .icon {
    display: block; width: var(--icon); height: var(--icon); border-radius: 50%; border: var(--ring) solid #fff;
    background: #fff; box-shadow: 0 6px 18px rgba(0,0,0,.25); flex: none;
  }
  .block h2 { margin: 10px 0 12px; font-size: var(--h2); font-weight: 700; line-height: 1; text-align: center; }
  .spiele { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: var(--zeile-abstand); }
  .spiel {
    display: flex; justify-content: space-between; align-items: center; height: var(--zeile-h); padding: 0 4px 0 12px;
    background: rgba(255,255,255,.5); color: inherit; text-decoration: none; font-size: var(--zeile-f); font-weight: 600;
    transition: transform .18s ease-out, background-color .18s;
  }
  .grau .spiel { background: rgba(255,255,255,.18); }
  .spiel .r { display: flex; align-items: center; white-space: nowrap; }
  .spiel small { font-size: var(--wert-f); font-weight: 400; opacity: .9; font-variant-numeric: tabular-nums; }
  .play {
    flex: none; width: var(--play); height: var(--play); margin-left: 8px; border-radius: 50%; background: var(--blau);
    display: inline-grid; place-items: center; transition: transform .18s;
  }
  .play svg { width: 42%; height: 42%; margin-left: 8%; fill: #fff; }
  @media (hover: hover) {
    a.spiel:hover { transform: translateX(3px); background: rgba(255,255,255,.72); }
    .grau a.spiel:hover { background: rgba(255,255,255,.3); }
    a.spiel:hover .play { transform: scale(1.12); }
  }
  a.spiel:active { transform: scale(.98); }
  a.spiel:focus-visible { outline: 2px solid var(--blau); outline-offset: 2px; }
  /* noch nicht gebaut: nur abgegraut, nicht antippbar, ohne Hinweistext (kein „demnächst“, MZ 21.10.2026) */
  .spiel.bald { opacity: .42; pointer-events: none; cursor: default; }
  .spiel.bald .play { background: #8a8a8a; }
  /* Band unten: Adresse, Impressum, Datenschutz */
  .fuss {
    flex: none; background: var(--grau); color: #fff; font-size: 11px; line-height: 1.45; text-align: center;
    padding: 10px 8px calc(10px + env(safe-area-inset-bottom));
  }
  .fuss p { margin: 0; }
  .fuss .teil { white-space: nowrap; }
  .fuss a { color: inherit; text-decoration: underline; text-decoration-color: rgba(255,255,255,.5); text-underline-offset: 2px; }
  .fuss a:hover, .fuss a:focus-visible { text-decoration-color: #fff; }
  .fuss .trenner-quer { display: none; }

  /* Querformat (MZ, 23.10.2026, „passt so“): drei Blöcke nebeneinander, gleich breit und hoch, Inhalt senkrecht mittig */
  @media (orientation: landscape) and (min-width: 560px) {
    .bloecke { grid-template-columns: repeat(3, 1fr); grid-auto-rows: auto; }
    .block { padding: 16px 16px 12px; }
    .fuss p { display: inline; }
    .fuss .trenner-quer { display: inline; }
    /* Handy quer (z. B. 780 × 360): kleiner, Seite scrollt kurz */
    :root { --balken-h: 46px; --logo-h: 30px; --ton: 26px; --name: 28px; --best: 19px; --icon: 104px; --ring: 5px; --h2: 20px;
      --zeile-h: 28px; --zeile-abstand: 6px; --zeile-f: 13px; --wert-f: 10px; --play: 20px; }
    .kopf { padding: 6px 16px 8px; }
    .best { margin-top: 14px; }
    .bloecke { height: 300px; flex: none; }
    .block h2 { margin: 9px 0; }
    .spiel { padding: 0 4px 0 10px; }
    .play { margin-left: 6px; }
    :root { --play-ml: 6px; }
    .fuss { font-size: 10px; padding: 7px 8px calc(7px + env(safe-area-inset-bottom)); }
  }
  /* PC/Tablet quer (z. B. 1280 × 720): Blöcke füllen die Höhe, alles ohne Scrollen */
  @media (orientation: landscape) and (min-width: 900px) and (min-height: 600px) {
    :root { --balken-h: 64px; --logo-h: 42px; --ton: 30px; --name: 40px; --best: 22px; --icon: 170px; --ring: 6px; --h2: 30px;
      --zeile-h: 34px; --zeile-abstand: 8px; --zeile-f: 15px; --wert-f: 12px; --play: 24px; }
    .kopf { padding: 10px 16px 10px; }
    .best { margin-top: 32px; }
    .bloecke { flex: 1 1 auto; height: auto; min-height: 380px; }
    .block { padding: 8px 34px 8px; }
    .block h2 { margin: 14px 0; }
    .spiel { padding: 0 6px 0 14px; }
    :root { --zeile-pr: 6px; }
    .fuss { font-size: 12px; padding: 9px 8px calc(9px + env(safe-area-inset-bottom)); }
  }
  /* Kopf im Querformat (MZ, 24.10.2026; Vorlage Material/Vorschau/kopf-quer/kopf-quer-vorschlaege.html: Anordnung wie
     Vorschlag 2, Punkte wie Vorschlag 3): eine weiße Kopfleiste – links Logo, feine senkrechte Linie, Wortmarke (getrennte
     Elemente); rechts „Deine RSI protect Punkte“ klein über der großen Zahl (weiß auf Lila), direkt vor dem Ton-Knopf.
     Umsetzung: Seite als Raster – Logo-Balken (links) und Kopf (rechts) teilen sich die erste Zeile; Blöcke und Band volle Breite. */
  @media (orientation: landscape) and (min-width: 560px) {
    :root { --balken-h: 136px; --logo-h: 40px; --ton: 28px; --name: 30px; --best-t: 11px; --best-z: 20px; }   /* Höhe wie vor der Umstellung (MZ 24.10.2026) */
    body { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto 1fr auto; position: relative; }
    .bloecke, .fuss { grid-column: 1 / -1; }
    .logobalken { position: static; justify-content: flex-start; padding-left: 20px; animation-name: balkenReinQuer !important; translate: none !important; }
    /* Nur Deckkraft: ein „translate“ am Logo-Balken würde den Ton-Knopf an den Balken binden statt an die Seite – er lag dann über dem Logo */
    #tonKnopf { z-index: 3; right: 20px; }   /* liegt jetzt über der Kopfzeile rechts (Bezug: body), Randabstand wie das Logo links */
    .kopf {
      animation-name: balkenReinQuer !important; translate: none !important;   /* kein translate: sonst wäre .kopf Bezug der Punkte-Anzeige */
      display: flex; align-items: center; justify-content: space-between; gap: 16px; text-align: left;
      padding: env(safe-area-inset-top) calc(14px + var(--ton) + 16px) 0 0; height: calc(var(--balken-h) + env(safe-area-inset-top));
    }
    /* Wortmarke endet vor der mittigen Punkte-Anzeige: Platz = halbe Breite − halbe Anzeige − Abstand − Logo-Teil */
    .name { justify-content: flex-start; font-size: min(var(--name), calc((50vw - var(--name-rest, 200px)) / 10.6)); }
    .name::before { content: ""; align-self: center; width: 1px; height: 1.7em; margin: 0 .75em 0 .8em; background: #d6d6d6; }   /* feine Trennlinie zum Logo */
    .best { margin: 0; display: flex; flex-direction: column; align-items: center; font-size: var(--best-t); line-height: 1.15; letter-spacing: .3px; white-space: nowrap; }
    /* MZ 24.10.2026: Punkte-Anzeige in der Seitenmitte (links Logo + Wortmarke, rechts Ton-Knopf, je mit Randabstand) */
    .best { position: absolute; left: 50%; top: calc(env(safe-area-inset-top) + var(--balken-h) / 2); transform: translate(-50%, -50%); }
    .best .dp { display: none; }
    .best b { font-size: var(--best-z); margin-top: 3px; }
  }
  @media (orientation: landscape) and (min-width: 900px) and (min-height: 600px) {
    :root { --balken-h: 204px; --logo-h: 64px; --ton: 40px; --name: 44px; --best-t: 16px; --best-z: 34px; }   /* Höhe wie vor der Umstellung (MZ 24.10.2026) */
    .logobalken { padding-left: 28px; }
    #tonKnopf { right: 28px; }
    :root { --name-rest: 300px; }
    .best b { margin-top: 4px; }
  }

  /* ---------- Sanfte Animationen (MZ, 22.10.2026): gestaffelt einblenden, nie hektisch ---------- */
  @keyframes balkenRein { from { opacity: 0; translate: 0 -100%; } }
  @keyframes balkenReinQuer { from { opacity: 0; } }
  @keyframes rein { from { opacity: 0; translate: 0 14px; } }
  @keyframes iconRein { 0% { opacity: 0; scale: .6; } 65% { opacity: 1; scale: 1.06; } 100% { scale: 1; } }
  @keyframes fussRein { from { opacity: 0; translate: 0 100%; } }
  .logobalken { animation: balkenRein .55s .02s cubic-bezier(.2,.8,.3,1) both; }
  .kopf { animation: rein .5s .15s ease-out both; }
  .block .icon { animation: iconRein .6s calc(.28s + var(--b) * .12s) cubic-bezier(.2,.9,.3,1.2) both; }
  .block h2 { animation: rein .45s calc(.42s + var(--b) * .12s) ease-out both; }
  .spiel { animation: rein .4s calc(.52s + var(--b) * .12s + var(--z) * .06s) ease-out both; }
  .summe { animation: rein .4s calc(.7s + var(--b) * .12s) ease-out both; }   /* nach der 3. Spielzeile */
  .fuss { animation: fussRein .5s .9s cubic-bezier(.2,.8,.3,1) both; }
  .block:nth-child(1) { --b: 0; } .block:nth-child(2) { --b: 1; } .block:nth-child(3) { --b: 2; }
  .spiel:nth-child(1) { --z: 0; } .spiel:nth-child(2) { --z: 1; } .spiel:nth-child(3) { --z: 2; }
  .spiel.bald { animation-name: reinBald; }
  @keyframes reinBald { from { opacity: 0; translate: 0 14px; } to { opacity: .42; } }
  /* weniger Bewegung: siehe Ende des Stils (nur Deckkraft-Einblendungen bleiben) */

  /* ---------- Intro „Die drei Kreise finden ihren Platz“ (MZ, 23.10.2026, „top“): ca. 3s beim ersten Öffnen der Sitzung.
     Weißer Grund, App-Icon ploppt auf → Logo gleitet an seine Stelle im Logo-Balken, „entSPANNUNG“ blendet ein → die drei
     Icons lösen sich, wachsen, fliegen an ihre Block-Plätze und bekommen den weißen Ring; am Ziel breitet sich die Blockfarbe
     wellenförmig aus, „SPANNUNG“ flackert kurz beim Blitz-Kreis → Bereichsnamen, Spielzeilen, Gesamt-Bestwert gestaffelt.
     Gezeichnet auf #intro (Leinwand über der Seite), die Seite darunter steuert das Skript. Tippen überspringt, ohne Ton. */
  html.intro { overflow: hidden; }
  html.intro body::before { content: ""; position: fixed; inset: 0; z-index: 29; background: #fff; }   /* bis die Leinwand steht */
  html.intro.introLeinwand body::before { display: none; }
  #intro { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; z-index: 30; display: block; touch-action: none; cursor: pointer; }
  html.intro .logobalken, html.intro .kopf, html.intro .icon, html.intro .block h2, html.intro .spiel, html.intro .summe, html.intro .fuss,
  html.nachIntro .logobalken, html.nachIntro .kopf, html.nachIntro .icon, html.nachIntro .block h2, html.nachIntro .spiel, html.nachIntro .summe, html.nachIntro .fuss { animation: none; }
  html.intro .logo, html.intro .name, html.intro .best, html.intro .icon, html.intro .block h2, html.intro .spiel, html.intro .summe, html.intro .fuss,
  html.intro .flaeche, html.intro #tonKnopf { opacity: 0; }
  html.nachIntro .spiel.bald { opacity: .42; }

  /* ---------- Ruhe-Animationen (MZ, 23.10.2026): nach dem Einblenden bzw. Intro (Klasse „ruhe“), dezent, nie hektisch.
     Nur transform/opacity/filter (ruckelfrei am Handy). Einmal-Effekte (Blitz, Stecker, Titel) steuert das Skript per
     Web Animations; Dauer-Effekte (Lotus atmet, ▶ lädt ein) hier. Versteckter Tab: alles angehalten („pausiert“). */
  .spiel { position: relative; }
  .play { position: relative; }
  /* Lotus „atmet“: ±3 % im 5s-Takt, beginnt bei 100 % (kein Sprung) */
  @keyframes atmen { 0%, 100% { transform: scale(1); } 25% { transform: scale(1.03); } 75% { transform: scale(.97); } }
  html.ruhe .hell .icon { animation: atmen 5s ease-in-out infinite; }
  /* ▶ des zuletzt gespielten (sonst ersten spielbaren) Spiels: sanfter Ring alle 2,5s, Knopf wächst kurz mit */
  .play::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--blau); opacity: 0; pointer-events: none; }
  @keyframes einladungRing { 0% { transform: scale(1); opacity: .8; } 60%, 100% { transform: scale(1.85); opacity: 0; } }
  @keyframes einladungKnopf { 0%, 100% { scale: 1; } 12% { scale: 1.09; } 30% { scale: 1; } }
  html.ruhe .spiel.einladung:not(.bald) .play::after { animation: einladungRing 2.5s ease-out infinite; }
  html.ruhe .spiel.einladung:not(.bald) .play { animation: einladungKnopf 2.5s ease-in-out infinite; }
  .grau .play::after { border-color: #fff; }
  /* Antippen (Finger und Maus): Zeile/Knopf drückt sich ein, kleiner Ring breitet sich an der Tippstelle aus */
  .tippbox { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .tippring {
    position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; pointer-events: none;
    background: rgba(255,255,255,.6); animation: tippring .55s ease-out forwards;
  }
  .grau .tippring { background: rgba(255,255,255,.4); }
  #tonKnopf { overflow: visible; }
  #tonKnopf .tippring { background: none; border: 2px solid var(--blau); width: 30px; height: 30px; margin: -15px 0 0 -15px; }
  @keyframes tippring { from { transform: scale(.25); opacity: .9; } to { transform: scale(3.2); opacity: 0; } }
  a.spiel.gedrueckt { transform: scale(.965); background-color: rgba(255,255,255,.8); transition-duration: .08s; }
  .grau a.spiel.gedrueckt { background-color: rgba(255,255,255,.34); }
  a.spiel.gedrueckt .play { transform: scale(.86); transition-duration: .08s; }
  #tonKnopf.gedrueckt { transform: scale(.86); filter: brightness(1.15); transition-duration: .08s; }
  /* Funken am Stecker (Elemente legt das Skript kurz an) */
  .funke { position: absolute; left: 0; top: 0; border-radius: 50%; pointer-events: none; z-index: 1; }
  /* Funken weiß mit orangem Schein – auf dem gelben Icon sonst kaum sichtbar */
  .funke.glanz { background: radial-gradient(circle, #fff 0%, #fffbe6 22%, rgba(255,150,0,.6) 46%, rgba(255,150,0,0) 70%); }
  .funke.stueck { background: #fff; box-shadow: 0 0 3px 1px rgba(255,130,0,.95); }
  html.pausiert *, html.pausiert *::after { animation-play-state: paused !important; }

  /* ---------- Sammlungs-Siegerfeier (MZ, 23.10.2026, Variante B): Siegel „Meister/in der entSPANNUNG“ ab 6.000 / 7.500 /
